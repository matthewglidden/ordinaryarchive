name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
