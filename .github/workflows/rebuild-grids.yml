name: Rebuild grids

on:
  schedule:
    - cron: "5 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: rebuild-grids
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build grids dataset
        run: node scripts/build-grids.mjs --incremental
      - name: Check for suspicious duplications
        id: duplication_check
        run: node scripts/check-suspicious-duplications.mjs
      - name: Commit updated dataset
        run: |
          if git status --porcelain | grep -q "data/grids.json"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/grids.json
            git commit -m "Update grids dataset"
            git push
          else
            echo "No changes to commit."
          fi
      - name: Upload ingestion debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: grid-ingestion-debug
          path: tmp/grid-debug/*.json
          if-no-files-found: ignore
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const titlePrefix = `Ordinary Archive daily grid build failed`;
            const title = `${titlePrefix} (${context.runNumber})`;
            const body = [
              `The scheduled grid rebuild failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- Workflow: ${context.workflow}`,
              `- Ref: ${context.ref}`,
              `- SHA: ${context.sha}`,
            ].join('\n');

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const existing = openIssues
              .filter((issue) => !issue.pull_request && issue.title.startsWith(titlePrefix))
              .sort((a, b) => a.number - b.number);

            if (existing.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Another grid rebuild failed.\n\n${body}`,
              });
              for (const duplicate of existing.slice(1)) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: duplicate.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: Close resolved rebuild issues
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const titlePrefix = `Ordinary Archive daily grid build failed`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const rebuildIssues = openIssues.filter(
              (issue) => !issue.pull_request && issue.title.startsWith(titlePrefix)
            );
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            for (const issue of rebuildIssues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved by successful grid rebuild: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
